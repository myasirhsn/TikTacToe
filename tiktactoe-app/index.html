<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        --bg: #1e1f29;
        --bg-deep: #171821;
        --panel: #282a3a;
        --surface: #33354a;
        --surface-hover: #444863;
        --text: #f4f5fa;
        --text-dim: #9aa0b5;
        --x-accent: #ff9f43;
        --o-accent: #4fc3f7;
        --win: #2ecc71;
        --error: #ff6b6b;
        --border: rgba(255, 255, 255, 0.06);
        --radius: 12px;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }

      [data-theme='light'] {
        --bg: #f2f4fa;
        --bg-deep: #e5e9f4;
        --panel: #ffffff;
        --surface: #e8eaf3;
        --surface-hover: #dfe2ee;
        --text: #1e1f29;
        --text-dim: #5c6178;
        --x-accent: #e07b1f;
        --o-accent: #0e7fc4;
        --win: #1f9d58;
        --error: #d43535;
        --border: #d4d6e3;
        --shadow: 0 12px 28px rgba(30, 31, 41, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg) 100%);
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--text);
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      button {
        font-family: inherit;
      }

      .game {
        width: 100%;
        max-width: 720px;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        transition:
          background 0.25s ease,
          border-color 0.25s ease;
      }

      .game__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .game__title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .theme-toggle {
        height: 44px;
        min-width: 44px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
        transition:
          background-color 0.12s ease,
          transform 0.05s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .theme-toggle:hover {
        background: var(--surface-hover);
      }

      .theme-toggle:active {
        transform: scale(0.96);
      }

      .theme-toggle:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--x-accent);
        outline-offset: 2px;
      }

      .game__body {
        display: flex;
        gap: 24px;
        flex-direction: column;
      }

      .game__board-wrap {
        flex: 1;
        min-width: 0;
      }

      .game__status {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        padding: 8px 16px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        transition:
          background-color 0.12s ease,
          color 0.25s ease;
      }

      .game__status--x {
        color: var(--x-accent);
      }

      .game__status--o {
        color: var(--o-accent);
      }

      .game__status--win {
        color: var(--win);
      }

      .game__status--draw {
        color: var(--text-dim);
      }

      .game__status--thinking {
        color: var(--text-dim);
        animation: status-pulse 1s ease-in-out infinite;
      }

      @keyframes status-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
      }

      .board--thinking {
        animation: board-pulse 1s ease-in-out infinite;
      }

      @keyframes board-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .cell {
        aspect-ratio: 1;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: clamp(32px, 9vw, 56px);
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        transition:
          background-color 0.12s ease,
          transform 0.05s ease,
          opacity 0.12s ease,
          box-shadow 0.12s ease;
      }

      .cell:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      .cell:active:not(:disabled) {
        transform: scale(0.96);
      }

      .cell:disabled {
        cursor: default;
      }

      .cell--x {
        color: var(--x-accent);
      }

      .cell--o {
        color: var(--o-accent);
      }

      .cell--placed {
        animation: scale-in 0.15s ease-out;
      }

      @keyframes scale-in {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .cell--clearing {
        opacity: 0;
        transform: scale(0.6);
      }

      .board--finished .cell:not(.is-winning) {
        opacity: 0.5;
        transform: scale(0.96);
      }

      .cell.is-winning {
        background-color: color-mix(in srgb, var(--x-accent) 18%, transparent);
        border-color: var(--x-accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--x-accent) 40%, transparent);
        animation: win-glow 1.2s ease 2;
      }

      .cell.is-winning--o {
        background-color: color-mix(in srgb, var(--o-accent) 18%, transparent);
        border-color: var(--o-accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--o-accent) 40%, transparent);
      }

      @keyframes win-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 4px transparent);
        }
        50% {
          filter: drop-shadow(0 0 12px var(--x-accent));
        }
      }

      .cell.is-winning--o {
        animation-name: win-glow-o;
      }

      @keyframes win-glow-o {
        0%,
        100% {
          filter: drop-shadow(0 0 4px transparent);
        }
        50% {
          filter: drop-shadow(0 0 12px var(--o-accent));
        }
      }

      .game__panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .mode-select {
        display: flex;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      .mode-select__option {
        flex: 1;
        height: 48px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.12s ease,
          color 0.12s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .mode-select__option:not(:last-child) {
        border-right: 1px solid var(--border);
      }

      .mode-select__option--active {
        background: var(--surface-hover);
        color: var(--text);
      }

      .panel-button {
        height: 48px;
        border: none;
        border-radius: var(--radius);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.12s ease,
          transform 0.05s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .panel-button:active:not(:disabled) {
        transform: scale(0.97);
      }

      .panel-button--primary {
        background: var(--x-accent);
        color: #20130a;
      }

      .panel-button--primary:hover {
        background: var(--surface-hover);
      }

      .panel-button--ghost {
        background: transparent;
        color: var(--text-dim);
        font-size: 13px;
        font-weight: 500;
        height: auto;
        padding: 4px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .panel-button--ghost:hover {
        color: var(--text);
      }

      .panel-actions {
        display: flex;
        gap: 10px;
      }

      .panel-actions .panel-button {
        flex: 1;
      }

      .panel-button--secondary {
        background: var(--surface-hover);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .panel-button--secondary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--surface-hover) 75%, var(--text-dim));
      }

      .panel-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .score {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .score__item {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--border);
      }

      .score__label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .score__value {
        display: block;
        margin-top: 2px;
        font-size: 20px;
        font-weight: 700;
      }

      .score__item--x .score__value {
        color: var(--x-accent);
      }

      .score__item--o .score__value {
        color: var(--o-accent);
      }

      .score__item--draws .score__value {
        color: var(--text-dim);
      }

      /* ---------- Desktop layout ---------- */
      @media (min-width: 768px) {
        .game__body {
          flex-direction: row;
          align-items: flex-start;
        }

        .game__board-wrap {
          min-width: 320px;
        }

        .game__panel {
          width: 240px;
        }

        .board {
          margin: 0;
          max-width: 420px;
        }
      }

      /* ---------- Win confetti ---------- */
      .confetti {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti__piece {
        position: absolute;
        top: -24px;
        width: 8px;
        height: 14px;
        border-radius: 2px;
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg);
        animation: confetti-fall var(--confetti-duration, 2s) ease-in var(--confetti-delay, 0s)
          forwards;
      }

      .confetti__piece--wide {
        width: 5px;
        height: 10px;
      }

      @keyframes confetti-fall {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          opacity: 0.85;
          transform: translate3d(var(--confetti-drift, 0px), 110vh, 0)
            rotate(var(--confetti-rotation, 720deg));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="Tic-Tac-Toe game">
      <header class="game__header">
        <h1 class="game__title">Tic-Tac-Toe</h1>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Toggle dark and light mode"
        >
          🌗
        </button>
      </header>

      <div class="game__body">
        <section class="game__board-wrap" aria-label="Game board">
          <div class="game__status" id="status" role="status" aria-live="polite">
            X&rsquo;s turn
          </div>
          <div class="board" id="board" aria-label="Tic-Tac-Toe board, 3 by 3 grid"></div>
        </section>

        <aside class="game__panel" aria-label="Game controls">
          <div class="mode-select" role="group" aria-label="Game mode">
            <button
              type="button"
              class="mode-select__option mode-select__option--active"
              data-mode="pvp"
            >
              Two-player
            </button>
            <button type="button" class="mode-select__option" data-mode="ai">vs AI</button>
          </div>

          <div class="panel-actions">
            <button
              type="button"
              class="panel-button panel-button--primary"
              id="restart"
              aria-label="Restart round"
            >
              Restart
            </button>
            <button
              type="button"
              class="panel-button panel-button--secondary"
              id="undo"
              aria-label="Undo last move"
              disabled
            >
              Undo Move
            </button>
          </div>

          <div class="score" aria-label="Score">
            <div class="score__item score__item--x">
              <span class="score__label">X wins</span>
              <span class="score__value" id="scoreX">0</span>
            </div>
            <div class="score__item score__item--o">
              <span class="score__label">O wins</span>
              <span class="score__value" id="scoreO">0</span>
            </div>
            <div class="score__item score__item--draws">
              <span class="score__label">Draws</span>
              <span class="score__value" id="scoreD">0</span>
            </div>
          </div>

          <button type="button" class="panel-button panel-button--ghost" id="resetScores">
            Reset scores
          </button>
        </aside>
      </div>

      <noscript>
        <p style="color: var(--text); text-align: center; margin-top: 12px">
          Tic-Tac-Toe requires JavaScript to run.
        </p>
      </noscript>
    </main>

    <script>
      (function () {
        'use strict';

        var LINES = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        var SCORES_KEY = 'xtt-scores';
        var THEME_KEY = 'xtt-theme';

        var boardEl = document.getElementById('board');
        var statusEl = document.getElementById('status');
        var themeToggle = document.getElementById('themeToggle');
        var restartBtn = document.getElementById('restart');
        var undoBtn = document.getElementById('undo');
        var resetScoresBtn = document.getElementById('resetScores');
        var scoreXEl = document.getElementById('scoreX');
        var scoreOEl = document.getElementById('scoreO');
        var scoreDEl = document.getElementById('scoreD');
        var modeButtons = Array.prototype.slice.call(
          document.querySelectorAll('.mode-select__option'),
        );

        var state = {
          cells: new Array(9).fill(null),
          current: 'X',
          mode: 'pvp',
          finished: false,
          winner: null,
          winningLine: null,
          aiThinking: false,
          history: [],
        };

        var aiTimer = null;

        var scores = loadScores();

        function loadScores() {
          try {
            var raw = JSON.parse(localStorage.getItem(SCORES_KEY));
            if (raw && typeof raw.x === 'number' && typeof raw.o === 'number') {
              return { x: raw.x, o: raw.o, draws: raw.draws || 0 };
            }
          } catch (e) {
            // fall through to fresh scores
          }
          return { x: 0, o: 0, draws: 0 };
        }

        function saveScores() {
          try {
            localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
          } catch (e) {
            // storage may be unavailable; scores just won't persist
          }
        }

        var cells = [];
        for (var i = 0; i < 9; i++) {
          var cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cell';
          cell.setAttribute('aria-label', 'Cell ' + String(i + 1) + ', empty');
          cell.dataset.index = String(i);
          cell.addEventListener('click', function () {
            handleCellClick(Number(this.dataset.index));
          });
          boardEl.appendChild(cell);
          cells.push(cell);
        }

        function setStatus(text, tone) {
          statusEl.textContent = text;
          statusEl.className = 'game__status' + (tone ? ' game__status--' + tone : '');
        }

        function currentPlayerName() {
          return state.current === 'X' ? 'X' : 'O';
        }

        function updateTurnStatus() {
          if (state.finished) {
            return;
          }
          if (state.mode === 'ai' && state.current === 'O') {
            setStatus('AI thinking\u2026', 'thinking');
          } else {
            setStatus(currentPlayerName() + '\u2019s turn', state.current.toLowerCase());
          }
        }

        function renderCell(index) {
          var mark = state.cells[index];
          var cell = cells[index];
          cell.textContent = mark || '';
          cell.className = 'cell';
          if (mark) {
            cell.classList.add('cell--' + mark.toLowerCase());
            cell.classList.add('cell--placed');
            cell.setAttribute('aria-label', 'Cell ' + String(index + 1) + ', ' + mark);
            cell.disabled = true;
          } else {
            cell.setAttribute('aria-label', 'Cell ' + String(index + 1) + ', empty');
            cell.disabled = state.aiThinking || state.finished;
          }
        }

        function renderBoard() {
          for (var i = 0; i < 9; i++) {
            renderCell(i);
          }
        }

        function findWinner(cells) {
          for (var l = 0; l < LINES.length; l++) {
            var a = LINES[l];
            if (cells[a[0]] && cells[a[0]] === cells[a[1]] && cells[a[1]] === cells[a[2]]) {
              return { winner: cells[a[0]], line: a };
            }
          }
          return null;
        }

        function isBoardFull(cells) {
          for (var i = 0; i < cells.length; i++) {
            if (!cells[i]) {
              return false;
            }
          }
          return true;
        }

        function highlightWin(line, winner) {
          var cls = winner === 'X' ? 'is-winning' : 'is-winning is-winning--o';
          for (var i = 0; i < line.length; i++) {
            cells[line[i]].classList.add(cls);
          }
          boardEl.classList.add('board--finished');
        }

        function finishGame(result) {
          state.finished = true;
          boardEl.classList.remove('board--thinking');

          if (result && result.winner) {
            state.winner = result.winner;
            state.winningLine = result.line;
            scores[result.winner.toLowerCase()] += 1;
            saveScores();
            highlightWin(result.line, result.winner);
            setStatus(result.winner + ' wins!', result.winner.toLowerCase());
            fireConfetti(result.winner);
          } else {
            scores.draws += 1;
            saveScores();
            setStatus('It\u2019s a draw', 'draw');
          }
          renderScores();
          updateUndoButton();
        }

        function handleCellClick(index) {
          if (state.finished || state.aiThinking || state.cells[index]) {
            return;
          }
          placeMark(index, state.current);
        }

        function placeMark(index, player) {
          state.cells[index] = player;
          state.history.push({ index: index, player: player });
          renderCell(index);

          var result = findWinner(state.cells);
          if (result) {
            finishGame(result);
            return;
          }
          if (isBoardFull(state.cells)) {
            finishGame(null);
            return;
          }

          state.current = player === 'X' ? 'O' : 'X';
          updateUndoButton();
          if (state.mode === 'ai' && state.current === 'O') {
            startAiTurn();
          } else {
            updateTurnStatus();
          }
        }

        function startAiTurn() {
          state.aiThinking = true;
          boardEl.classList.add('board--thinking');
          renderBoard();
          updateTurnStatus();
          aiTimer = window.setTimeout(aiMove, 420);
        }

        /* ---- AI logic: one-ply "don't lose now" + random ---- */

        function aiMove() {
          if (state.finished || !state.aiThinking) {
            return;
          }
          state.aiThinking = false;
          boardEl.classList.remove('board--thinking');

          var empty = [];
          for (var i = 0; i < state.cells.length; i++) {
            if (!state.cells[i]) {
              empty.push(i);
            }
          }
          if (empty.length === 0) {
            state.current = 'O';
            return;
          }

          var move = aiPickMove(empty);
          state.current = 'O';
          placeMark(move, 'O');
        }

        function aiPickMove(empty) {
          var o = 'O';
          var x = 'X';

          var winMove = findWinningMove(state.cells, empty, o);
          if (winMove !== -1) {
            return winMove;
          }

          var blockMove = findWinningMove(state.cells, empty, x);
          if (blockMove !== -1) {
            return blockMove;
          }

          var center = 4;
          if (state.cells.indexOf(center) === -1 && empty.indexOf(center) !== -1) {
            return center;
          }

          var corners = [0, 2, 6, 8].filter(function (c) {
            return empty.indexOf(c) !== -1;
          });
          if (corners.length > 0) {
            return corners[Math.floor(Math.random() * corners.length)];
          }

          return empty[Math.floor(Math.random() * empty.length)];
        }

        function findWinningMove(cells, empty, player) {
          for (var e = 0; e < empty.length; e++) {
            var probe = cells.slice();
            probe[empty[e]] = player;
            if (findWinner(probe)) {
              return empty[e];
            }
          }
          return -1;
        }

        /* ---- Win confetti ---- */

        function fireConfetti(winner) {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var css = getComputedStyle(document.documentElement);
          var xColor = css.getPropertyValue('--x-accent').trim();
          var oColor = css.getPropertyValue('--o-accent').trim();
          var winColor = css.getPropertyValue('--win').trim();
          var palette =
            winner === 'O'
              ? [oColor, winColor, xColor, '#ffffff']
              : [xColor, winColor, oColor, '#ffffff'];

          var wrap = document.createElement('div');
          wrap.className = 'confetti';
          wrap.setAttribute('aria-hidden', 'true');
          wrap.setAttribute('role', 'presentation');

          for (var i = 0; i < 90; i++) {
            var piece = document.createElement('span');
            piece.className = 'confetti__piece';
            if (Math.random() < 0.5) {
              piece.classList.add('confetti__piece--wide');
            }
            piece.style.left = Math.floor(Math.random() * 100) + 'vw';
            piece.style.backgroundColor = palette[Math.floor(Math.random() * palette.length)];
            piece.style.setProperty(
              '--confetti-duration',
              (1.6 + Math.random() * 1.4).toFixed(2) + 's',
            );
            piece.style.setProperty('--confetti-delay', (Math.random() * 0.4).toFixed(2) + 's');
            piece.style.setProperty(
              '--confetti-drift',
              Math.floor(Math.random() * 260 - 130) + 'px',
            );
            piece.style.setProperty(
              '--confetti-rotation',
              Math.floor(Math.random() * 720 + 360) + 'deg',
            );
            wrap.appendChild(piece);
          }

          document.body.appendChild(wrap);
          window.setTimeout(function () {
            if (wrap.parentNode) {
              wrap.parentNode.removeChild(wrap);
            }
          }, 3600);
        }

        /* ---- Undo ---- */

        function undoMove() {
          if (state.finished || state.history.length === 0) {
            return;
          }
          if (aiTimer) {
            window.clearTimeout(aiTimer);
            aiTimer = null;
          }
          state.aiThinking = false;
          boardEl.classList.remove('board--thinking');

          if (state.mode === 'ai') {
            var last = state.history[state.history.length - 1];
            if (last && last.player === 'O') {
              state.history.pop();
              if (state.history.length > 0) {
                state.history.pop();
              }
            } else {
              state.history.pop();
            }
            state.current = 'X';
          } else {
            state.current = state.history.pop().player;
          }

          state.cells = new Array(9).fill(null);
          for (var i = 0; i < state.history.length; i++) {
            state.cells[state.history[i].index] = state.history[i].player;
          }

          renderBoard();
          updateTurnStatus();
          updateUndoButton();
        }

        function updateUndoButton() {
          undoBtn.disabled = state.finished || state.history.length === 0;
        }

        /* ---- Controls ---- */

        function setMode(mode) {
          state.mode = mode;
          modeButtons.forEach(function (btn) {
            btn.classList.toggle('mode-select__option--active', btn.dataset.mode === mode);
          });
          restartRound();
        }

        function restartRound() {
          if (aiTimer) {
            window.clearTimeout(aiTimer);
            aiTimer = null;
          }
          state.cells = new Array(9).fill(null);
          state.current = 'X';
          state.finished = false;
          state.winner = null;
          state.winningLine = null;
          state.aiThinking = false;
          state.history = [];

          boardEl.classList.remove('board--finished', 'board--thinking');

          for (var i = 0; i < cells.length; i++) {
            cells[i].classList.add('cell--clearing');
          }
          window.setTimeout(function () {
            for (var j = 0; j < cells.length; j++) {
              cells[j].classList.remove('cell--clearing');
            }
            renderBoard();
          }, 120);

          updateTurnStatus();
          updateUndoButton();
        }

        function resetScores() {
          scores = { x: 0, o: 0, draws: 0 };
          try {
            localStorage.removeItem(SCORES_KEY);
          } catch (e) {
            // ignore storage errors
          }
          renderScores();
        }

        function renderScores() {
          scoreXEl.textContent = String(scores.x);
          scoreOEl.textContent = String(scores.o);
          scoreDEl.textContent = String(scores.draws);
        }

        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          themeToggle.setAttribute(
            'aria-label',
            theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
          );
          try {
            localStorage.setItem(THEME_KEY, theme);
          } catch (e) {
            // ignore storage errors
          }
        }

        function toggleTheme() {
          var next =
            document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          applyTheme(next);
        }

        /* ---- Wire-up ---- */

        modeButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            setMode(btn.dataset.mode);
          });
        });

        restartBtn.addEventListener('click', restartRound);
        undoBtn.addEventListener('click', undoMove);
        resetScoresBtn.addEventListener('click', resetScores);
        themeToggle.addEventListener('click', toggleTheme);

        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem(THEME_KEY);
        } catch (e) {
          // ignore storage errors
        }
        applyTheme(savedTheme === 'light' ? 'light' : 'dark');

        renderScores();
        renderBoard();
        updateTurnStatus();
        updateUndoButton();
      })();
    </script>
  </body>
</html>
